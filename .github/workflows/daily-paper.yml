name: Daily Recommender Systems Paper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily paper note
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python scripts/daily_paper.py

      - name: Commit generated note
        run: |
          if git diff --quiet --exit-code; then
            echo "No new paper note generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/
          git commit -m "Add daily recommender systems paper"
          git push

